<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>kmcaq | Уютное местечко Кэм</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#0f0a17;
 --card:rgba(24,18,38,.72);
 --border:rgba(255,255,255,.12);
 --text:#faf7ff;
 --muted:#d1c2ea;
 --accent:#d66cff;
 --live:#ff4d6d;
}

*{margin:0;padding:0;box-sizing:border-box;}

html{
 scroll-behavior:smooth;
}

body{
 font-family:"Nunito",sans-serif;
 background:var(--bg);
 color:var(--text);
 overflow-x:hidden;
}

.background{
 position:fixed;
 inset:-60px;
 background:url("hero-bg.png") center/cover no-repeat;
 filter:brightness(.45);
 transform:scale(1.08);
 will-change:transform;
 z-index:-2;
}

.overlay{
 position:fixed;
 inset:0;
 background:linear-gradient(rgba(15,10,23,.18),rgba(15,10,23,.9));
 z-index:-1;
}

.particles{
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:-1;
 overflow:hidden;
}

.particles::before,
.particles::after{
 content:"";
 position:absolute;
 inset:-20%;
 background-repeat:repeat;
 opacity:.28;
 animation:particlesMove 40s linear infinite;
}

.particles::before{
 background-image:
 radial-gradient(circle,rgba(255,255,255,.55) 1px,transparent 1.5px);
 background-size:90px 90px;
}

.particles::after{
 background-image:
 radial-gradient(circle,rgba(214,108,255,.35) .8px,transparent 1.3px);
 background-size:140px 140px;
 animation-duration:60s;
 animation-direction:reverse;
}

@keyframes particlesMove{
 from{transform:translateY(0);}
 to{transform:translateY(-120px);}
}

section{
 max-width:1120px;
 margin:auto;
 padding:96px 24px;
 scroll-margin-top:80px;
}

section h2{
 font-size:40px;
 margin-bottom:30px;
}

.card{
 background:var(--card);
 backdrop-filter:blur(22px);
 border:1px solid var(--border);
 border-radius:28px;
 padding:32px;
 color:var(--muted);
}
</style>

</head>
<body>

<div class="background"></div>
<div class="overlay"></div>
<div class="particles"></div>

<div id="navbar"></div>

<main>

<div id="hero"></div>

<div id="links"></div>

<div id="gameshelf"></div>

<div id="schedule"></div>

</main>

<script src="js/main.js"></script>
<script src="js/live.js"></script>
<script src="js/navbar.js"></script>
<script src="js/gameshelf.js"></script>

</body>
</html>
