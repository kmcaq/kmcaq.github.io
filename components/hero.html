<style>
.hero{
 min-height:100vh;
 display:flex;
 align-items:center;
 padding:120px 7%;
 scroll-margin-top:60px;
}

.hero-grid{
 display:grid;
 grid-template-columns:1fr .95fr;
 gap:64px;
 align-items:center;
 max-width:1200px;
 margin:auto;
 width:100%;
}

.hero h1{
 font-size:74px;
 line-height:.95;
}

.hero h1 span{
 color:var(--accent);
}

.hero p{
 margin-top:22px;
 font-size:21px;
 line-height:1.7;
 color:var(--muted);
 max-width:560px;
}

.avatar-frame{
 position:relative;
 width:min(430px,92%);
 border-radius:28px;
 overflow:hidden;
 background:rgba(24,18,38,.55);
 border:1px solid rgba(255,255,255,.18);
 box-shadow:0 20px 45px rgba(0,0,0,.35);
 animation:avatarFloat 8s ease-in-out infinite;
}

.avatar{
 width:100%;
 display:block;
}

@keyframes avatarFloat{
 0%,100%{transform:translateY(0) rotate(-.4deg);}
 50%{transform:translateY(-3px) rotate(.4deg);}
}

#currentCard{
 max-width:560px;
 margin-top:28px;
 border-radius:24px;
 padding:24px;
}

.current-row{
 display:flex;
 flex-direction:column;
 gap:20px;
 align-items:flex-start;
}

.current-info h3{
 display:flex;
 align-items:center;
 gap:12px;
 font-size:22px;
 color:white;
}

.live-indicator{
 width:16px;
 height:16px;
 border-radius:50%;
 background:#ff4d6d;
 box-shadow:0 0 16px rgba(255,77,109,.7);
}

.link-btn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 padding:12px 22px;
 border-radius:14px;
 background:linear-gradient(135deg,#d66cff,#b84cff);
 color:white;
 text-decoration:none;
 font-weight:700;
}

@media(max-width:980px){
 .hero-grid{
  grid-template-columns:1fr;
  text-align:center;
 }
 .hero h1{
  font-size:54px;
 }
 .hero p{
  margin:auto;
 }
 .avatar-frame{
  margin:auto;
 }
}
</style>

<header id="home" class="hero">

<div class="hero-grid">

<div>

<h1>Привет, я <span>Кэм</span></h1>

<p>
Впервые прохожу сюжетные игры и делюсь настоящими эмоциями.
Без спойлеров, без токсичности и с уютной атмосферой.
</p>

<div class="card" id="currentCard">

<div class="current-row">

<div class="current-info">

<h3 id="currentTitle">
<span class="live-indicator"></span>
Последняя серия
</h3>

<p id="currentText">Загружаю информацию...</p>

</div>

<a id="currentButton" class="link-btn"
href="https://www.youtube.com/@kmcaq"
target="_blank">
Смотреть
</a>

</div>

</div>

</div>

<div class="avatar-frame">
<img src="avatar.png" class="avatar" alt="Кэм">
</div>

</div>

</header>
