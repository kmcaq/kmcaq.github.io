<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обратная связь — kmcaq</title>
    <meta
      name="description"
      content="Обратная связь с Кэм: предложить игру, сообщить о проблеме или отправить деловое предложение."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css?v=20261026-theme-4" />
    <link rel="stylesheet" href="/css/feedback.css?v=20261026-theme-4" />
      <link rel="icon" href="/favicon.ico?v=20261026-brand-1" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261026-brand-1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20261026-brand-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261026-brand-1" />
  </head>
  <body class="page-feedback">
    <div class="site-background"></div>
    <div class="site-overlay"></div>
    <div id="navbar"></div>
    <main class="site-main">
      <section class="feedback-page">
        <div class="feedback-header">
          <h1>Написать <span>мне</span></h1>
          <p>
            Предложить игру, задать вопрос или оставить сообщение.
          </p>
        </div>
        <form id="feedback-form" class="feedback-form">
          <fieldset class="feedback-topics" id="feedback-category">
            <legend>О чём хочешь написать?</legend>
            <div class="feedback-topic-list">
              <label class="feedback-topic">
                <input type="radio" name="category" value="game" checked required />
                <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="4"/><path d="M6 12h6m-3-3v6m7-5h.01m2 4h.01"/></svg>Игра</span>
              </label>
              <label class="feedback-topic">
                <input type="radio" name="category" value="moderation" required />
                <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/></svg>Модерация</span>
              </label>
              <label class="feedback-topic">
                <input type="radio" name="category" value="business" required />
                <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12l9 3 9-3"/></svg>Сотрудничество</span>
              </label>
              <label class="feedback-topic">
                <input type="radio" name="category" value="other" required />
                <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2v-10A8.5 8.5 0 0 1 10.5 3h2a8.5 8.5 0 0 1 8.5 8.5Z"/></svg>Другое</span>
              </label>
            </div>
          </fieldset>
          <div class="feedback-field">
            <label for="feedback-message">Сообщение</label
            ><textarea
              id="feedback-message"
              name="message"
              maxlength="5000"
              placeholder="Название игры и почему стоит попробовать"
              aria-describedby="feedback-hint feedback-count"
              required
            ></textarea>
            <div class="feedback-meta">
              <p class="feedback-hint" id="feedback-hint">Если нужен ответ, оставь контакт в сообщении.</p>
              <span class="feedback-count" id="feedback-count">0 / 5000</span>
            </div>
          </div>
          <div class="feedback-actions">
            <div id="feedback-status" class="feedback-status" role="status" aria-live="polite"></div>
            <button type="submit" class="feedback-submit" id="feedback-submit">Отправить сообщение</button>
          </div>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <span>© kmcaq · Играю в своё удовольствие ♡</span>
      <span class="site-footer-links"><a href="https://www.twitch.tv/kmcaq" target="_blank" rel="noopener noreferrer">Twitch</a><a href="https://www.youtube.com/@kmcaq" target="_blank" rel="noopener noreferrer">YouTube</a></span>
    </footer>
    <script src="/js/navbar.js?v=20261026-header-2"></script>
    <script src="/feedback/feedback.js?v=20261025-feedback-1"></script>
  </body>
</html>
