<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обратная связь — kmcaq</title>
    <meta
      name="description"
      content="Обратная связь с Кэм: предложить игру, сообщить о проблеме или отправить деловое предложение."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css?v=20261025-audit-1" />
    <link rel="stylesheet" href="/css/feedback.css?v=20261025-audit-1" />
  </head>
  <body class="page-feedback">
    <div class="site-background"></div>
    <div class="site-overlay"></div>
    <div id="navbar"></div>
    <main class="site-main">
      <section class="feedback-page">
        <div class="feedback-header">
          <h1>Обратная <span>связь</span></h1>
          <p>
            Здесь можно предложить игру, сообщить о проблеме, написать по поводу
            сотрудничества или просто оставить сообщение.
          </p>
        </div>
        <form id="feedback-form" class="feedback-form">
          <div class="feedback-field">
            <label for="feedback-category">Тема</label
            ><select id="feedback-category" name="category" required>
              <option value="game">🎮 Предложить игру</option>
              <option value="moderation">🛡️ Модерация</option>
              <option value="business">💼 Деловое предложение</option>
              <option value="other">💬 Другое</option>
            </select>
          </div>
          <div class="feedback-field">
            <label for="feedback-message">Сообщение</label
            ><textarea
              id="feedback-message"
              name="message"
              maxlength="5000"
              placeholder="Напиши всё, что хочешь мне сообщить..."
              required
            ></textarea>
            <div class="feedback-hint">
              Если хочешь получить ответ, можешь оставить свои контакты прямо в
              сообщении.
            </div>
          </div>
          <button type="submit" class="feedback-submit" id="feedback-submit">
            Отправить сообщение
          </button>
          <div
            id="feedback-status"
            class="feedback-status"
            role="status"
            aria-live="polite"
          ></div>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      © kmcaq ·
      <a
        href="https://www.twitch.tv/kmcaq"
        target="_blank"
        rel="noopener noreferrer"
        >Twitch</a
      >
      ·
      <a
        href="https://www.youtube.com/@kmcaq"
        target="_blank"
        rel="noopener noreferrer"
        >YouTube</a
      >
    </footer>
    <script src="/js/navbar.js?v=20261025-audit-1"></script>
    <script src="/feedback/feedback.js?v=20261025-audit-1"></script>
  </body>
</html>
