<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Игры | kmcaq</title><meta name="description" content="Игровая полка Кэм — игры, которые уже оставили след."><meta property="og:title" content="Игры | kmcaq"><meta property="og:image" content="/avatar.png"><meta property="og:type" content="website"><link rel="icon" href="/avatar.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0f0a17;--card:rgba(24,18,38,.78);--border:rgba(255,255,255,.12);--text:#faf7ff;--muted:#d1c2ea;--accent:#d66cff}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Nunito,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}.background{position:fixed;inset:-60px;background:url("../hero-bg.png") center/cover;filter:brightness(.42);z-index:-2}.overlay{position:fixed;inset:0;background:linear-gradient(rgba(15,10,23,.2),rgba(15,10,23,.94));z-index:-1}main{max-width:1120px;margin:auto;padding:140px 24px 80px}h1{font-size:52px;margin-bottom:12px}h1 span{color:var(--accent)}.subtitle{color:var(--muted);font-size:18px;margin-bottom:30px}.tier-row{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:var(--card);backdrop-filter:blur(22px);border:1px solid var(--border);border-radius:24px;padding:10px 12px;margin-bottom:8px}.tier-box{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:rgba(214,108,255,.14);border:1px solid rgba(214,108,255,.28);margin:auto}.tier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.game-card{cursor:pointer;transition:.22s}.game-card:hover{transform:translateY(-3px) scale(1.02)}.game-cover{width:100%;aspect-ratio:460/215;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.1);display:block}.gm-overlay{position:fixed;inset:0;background:rgba(8,6,14,.78);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:.2s;z-index:20}.gm-overlay.show{opacity:1;visibility:visible}.gm-modal{background:rgba(24,18,38,.98);border:1px solid var(--border);border-radius:28px;width:min(760px,100%);padding:28px;position:relative}.gm-close{position:absolute;right:16px;top:12px;background:none;border:0;color:white;font-size:30px;cursor:pointer}.gm-content{display:grid;grid-template-columns:190px 1fr;gap:26px}.gm-cover{width:100%;border-radius:18px}.gm-tier{display:inline-flex;padding:7px 16px;border-radius:999px;background:rgba(214,108,255,.15);border:1px solid rgba(214,108,255,.3);font-weight:800}.gm-title{font-size:34px;margin:14px 0}.gm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.gm-item{background:rgba(255,255,255,.05);border-radius:16px;padding:14px}.gm-item span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.gm-btn{display:inline-flex;margin-top:24px;padding:14px 22px;border-radius:16px;background:linear-gradient(135deg,#d66cff,#9146ff);color:white;text-decoration:none;font-weight:700}@media(max-width:800px){.tier-row{grid-template-columns:56px 1fr}.tier-grid{grid-template-columns:repeat(2,1fr)}.gm-content{grid-template-columns:1fr}.gm-cover{max-width:220px;margin:auto}.gm-grid{grid-template-columns:1fr}h1{font-size:42px}}</style></head><body><div class="background"></div><div class="overlay"></div><div id="navbar"></div><main><h1>Игровая <span>полка</span></h1><p class="subtitle">Здесь живут игры, которые уже успели оставить след.</p><div id="gameshelfContainer"></div></main><script src="../js/gameshelf.js"></script><script src="../js/navbar.js"></script><script src="../js/live.js"></script></body></html>
